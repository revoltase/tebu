<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkulator borongan tebu</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f5f3e9; color: #203e30; font: 1rem/1.55 "DM Sans",system-ui,sans-serif }
main { max-width: 850px; margin: 9vh auto; padding: 24px }
h1 { font: 500 clamp(2.5rem,7vw,4.6rem)/1.05 Georgia,serif; letter-spacing: -.045em; margin: 0 0 1rem }
p { margin: 0 0 2rem }
section { background: #fffef9; border: 1px solid #d2d6c7; border-radius: 18px; overflow: hidden }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 30px }
label { display: block; font-weight: 650 }
input { width: 100%; margin-top: 8px; border: 1px solid #909e90; border-radius: 7px; padding: 12px; font: inherit; color: inherit }
input:focus-visible { outline: 3px solid #6f9457 }
.result { background: #204a37; color: #fff; padding: 25px 30px }
output { display: block; font: 500 clamp(1.65rem,5vw,3rem)/1.25 Georgia,serif; margin-top: 8px; overflow-wrap: anywhere }
small { display: block; margin-top: 15px }
@media(max-width:550px){ main { margin: 5vh auto; padding: 18px } .fields { grid-template-columns: 1fr; padding: 22px } .result { padding: 22px } }
</style>
</head>
<body>
<main>
<h1>Kalkulator borongan tebu</h1>
<p>Hitung biaya pengerjaan kebun berdasarkan luas lahan dan tarif borongan per hektare.</p>
<section aria-label="Perhitungan biaya">
<div class="fields">
<label for="luas">Luas lahan (ha)<input id="luas" inputmode="decimal" value="1"></label>
<label for="tarif">Tarif per hektare (Rp)<input id="tarif" inputmode="numeric" value="25.000.000"></label>
</div>
<div class="result">Total biaya borongan
<output id="total" for="luas tarif" aria-live="polite"></output></div>
</section>
<small>Tarif awal mengikuti contoh penawaran Rp25 juta per hektare. Biaya panen dihitung terpisah.</small>
</main>
<script>
const luas = document.querySelector("#luas");
const tarif = document.querySelector("#tarif");
const total = document.querySelector("#total");
const rupiah = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
function hitung() {
  const area = luas.value.trim();
  const rate = tarif.value.trim();
  if (!/^\d+(?:[.,]\d+)?$/.test(area)) {
    total.textContent = "Masukkan luas lahan, misalnya 2,5.";
    return;
  }
  if (!/^(?:\d+|\d{1,3}(?:\.\d{3})+)$/.test(rate)) {
    total.textContent = "Masukkan tarif dalam rupiah penuh.";
    return;
  }
  const biaya = Number(area.replace(",", ".")) * Number(rate.replaceAll(".", ""));
  total.textContent = Number.isSafeInteger(Math.round(biaya)) ? rupiah.format(biaya) : "Nilai terlalu besar.";
}
document.addEventListener("input", hitung);
hitung();
</script>
</body>
</html>
